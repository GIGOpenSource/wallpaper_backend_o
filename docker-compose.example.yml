# Copy to docker-compose.yml and fill .env. Do not commit real passwords.
services:
  django_web:
    build:
      context: .
    container_name: wallpaper_django
    restart: always
    env_file:
      - .env
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
      - ./resource:/app/resource
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: wallpaper_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/usr/share/nginx/html/static:ro
      - ./page/markwallpapers:/usr/share/nginx/html/markwallpapers:ro
      - ./page/cert:/etc/nginx/cert:ro
    depends_on:
      - django_web
    networks:
      - app_network

  db:
    image: postgres:16-alpine
    container_name: wallpaper_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wallpaper_db}
      POSTGRES_USER: ${POSTGRES_USER:-wallpaper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wallpaper} -d ${POSTGRES_DB:-wallpaper_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wallpaper_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --protected-mode yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  app_network:

volumes:
  pgdata:
  redisdata:
