worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 100m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # 全部HTTP请求 80端口 强制跳转 HTTPSa
    server {
        listen 80;

        server_name example.com www.example.com;
        return 301 https://$host$request_uri;
    }

    # HTTPS 主站 www.markwallpapers.com
    server {
        listen 443 ssl;
        server_name www.example.com;

        ssl_certificate /etc/nginx/cert/server.crt;
        ssl_certificate_key /etc/nginx/cert/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        # 周包 sitemap 误写成 /markwallpapers/wallpaper/id，前端路由实际是 /wallpaper/id
        location = /markwallpapers {
            return 301 /;
        }
        location ^~ /markwallpapers/ {
            rewrite ^/markwallpapers/(.*)$ /$1 permanent;
        }

        location /agreement/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            expires 7d;
            add_header Content-Type "text/html; charset=utf-8";
        }
        location ^~ /privacy/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /privacy/index.html;
            expires 1d;
        }
        location = /privacy {
            return 301 /privacy/;
        }
#         location ~ ^/detail-sitemap-(\d+)\.xml$ {
#             root /usr/share/App/view/seo/sitemap/sitemap_files;
#             try_files detail-sitemap-$1.xml =404;
#             access_log off;
#             expires 1h;
#             add_header Cache-Control "public, max-age=3600";
#             add_header Content-Type "application/xml; charset=utf-8";
#             default_type application/xml;
#             open_file_cache max=1000 inactive=60m;
#             open_file_cache_valid 10m;
#             open_file_cache_min_uses 2;
#             open_file_cache_errors on;
#         }
        location ~ ^/detail-sitemap-(\d+)\.xml$ {
            root /usr/share/App/view/seo/sitemap/sitemap_files;
            # 改为 $uri，直接匹配完整请求文件名
            try_files $uri =404;
            access_log off;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            types { }
            default_type application/xml;
            add_header Content-Type "application/xml; charset=utf-8" always;
            open_file_cache max=1000 inactive=60m;
            open_file_cache_valid 10m;
            open_file_cache_min_uses 2;
            open_file_cache_errors on;
        }
        location = /robots.txt {
            proxy_pass http://django_web:8000/api/site/robots-txt/?raw=1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
            expires 7d;
            add_header Content-Type "text/plain; charset=utf-8";
        }

        location = /sitemap.xml {
            proxy_pass http://django_web:8000/api/seo/sitemap_urls/get-sitemap-xml/?raw=1&index=1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            types { }
            default_type application/xml;
            add_header Content-Type "application/xml; charset=utf-8" always;
        }
        location ~ ^/sitemap-(article|category|tag|page)\.xml$ {
            proxy_pass http://django_web:8000/api/seo/sitemap_urls/get-sitemap-xml/?raw=1&type=$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            types { }
            default_type application/xml;
            add_header Content-Type "application/xml; charset=utf-8" always;
        }

        # SEO 站点认证文件：resource/site_verify 下的 html/xml/txt 挂到网站根路径
        # 排除 index.html，否则主站 try_files 回落到 /index.html 会被这里抢走并 404
        location ~ ^/(?!index\.html$)[^/]+\.(html|xml|txt)$ {
            root /usr/share/nginx/html/site_verify;
            try_files $uri =404;
            access_log off;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
            charset utf-8;
        }

        # 主站前端
        location / {
            root /usr/share/nginx/html/markwallpapers;
            index index.html;
            try_files $uri $uri/ /index.html;
            expires 1d;
        }

        # API转发后端
        location /api/ {
            proxy_pass http://django_web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }
    }

    # HTTPS 裸域名 markwallpapers.com 跳转 www
    server {
        listen 443 ssl;
        server_name example.com;

        ssl_certificate /etc/nginx/cert/server.crt;
        ssl_certificate_key /etc/nginx/cert/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;

        return 301 https://www.example.com$request_uri;
    }

    # HTTPS 控制台 console.markwallpapers.com
    server {
        listen 443 ssl;
        server_name console.example.com;

        ssl_certificate /etc/nginx/cert/server.crt;
        ssl_certificate_key /etc/nginx/cert/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        location / {
            root /usr/share/nginx/html/enhance;
            index index.html;
            try_files $uri $uri/ /index.html;
            expires 1d;
        }


        location /api/ {
            proxy_pass http://django_web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}